<app-ticket-list-page data-h-ticket-list-page=""
  ><app-ticket-list-card
    class="flex flex-col h-full w-full items-center"
    data-s-ticket-list-page=""
    data-h-ticket-list-card=""
    ><section
      class="flex flex-col items-center justify-center w-full min-h-screen overflow-y-auto pb-3"
      data-s-ticket-list-card=""
    >
      <section class="tickets-header" data-s-ticket-list-card="">
        <button
          mat-mini-fab=""
          class="!bg-secondary mdc-fab mat-mdc-fab-base mdc-fab--mini mat-mdc-mini-fab mat-accent mat-mdc-button-base"
          data-s-ticket-list-card=""
        >
          <span class="mat-mdc-button-persistent-ripple mdc-fab__ripple"></span
          ><mat-icon
            role="img"
            class="mat-icon notranslate text-primary material-icons mat-ligature-font mat-icon-no-color"
            aria-hidden="true"
            data-mat-icon-type="font"
            data-s-ticket-list-card=""
            >arrow_back</mat-icon
          ><span class="mdc-button__label"></span
          ><span class="mat-mdc-focus-indicator"></span
          ><span class="mat-mdc-button-touch-target"></span></button
        ><img
          src="/assets/images/logos/logo-header.svg"
          class="tickets-header-logo"
          data-s-ticket-list-card=""
        />
      </section>
      <div class="ticket-list-card" data-s-ticket-list-card="">
        <div class="flex flex-row justify-between" data-s-ticket-list-card="">
          <p class="ticket-search-card-title" data-s-ticket-list-card="">
            PASSAGENS
          </p>
        </div>
        <div class="tickets-list-message" data-s-ticket-list-card="">
          <img
            src="/assets/images/icons/icone-sucesso.svg"
            data-s-ticket-list-card=""
          />
          <h3 data-s-ticket-list-card="">
            Não existem passagens para essa placa no momento.
          </h3>
          <p data-s-ticket-list-card="">
            As passagens podem levar até 48 horas para ficarem disponíveis para
            pagamento. Cadastre-se e receba informações das suas passagens!
          </p>
          <button
            class="custom-fab-button mdc-fab mat-mdc-fab-base mat-mdc-fab mat-accent mat-mdc-button-base mdc-fab--extended mat-mdc-extended-fab"
            data-s-ticket-list-card=""
          >
            <span
              class="mat-mdc-button-persistent-ripple mdc-fab__ripple"
            ></span
            ><span class="mdc-button__label">Quero me cadastrar</span
            ><span class="mat-mdc-focus-indicator"></span
            ><span class="mat-mdc-button-touch-target"></span>
          </button>
        </div>
        <div class="tickets-list-resume" data-s-ticket-list-card=""></div>
      </div></section></app-ticket-list-card
></app-ticket-list-page>
